<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc">
 <title id="title">TIMING ACTIVATION WINDOWS · 2025 – 2030</title> <desc id="desc">Timeline showing Primary, Secondary, and Tertiary activation windows with TODAY and LP Transition markers and a legend.</desc> <style> .title { font: 700 24px/1.1 "Helvetica Neue", Arial, sans-serif; fill:#111; text-anchor:middle; } .subtitle { font: 400 12px/1.1 "Helvetica Neue", Arial, sans-serif; fill:#333; text-anchor:middle; font-style:italic; } .year { font: 400 12px/1.1 "Helvetica Neue", Arial, sans-serif; fill:#333; text-anchor:middle; } .label { font: 600 16px/1.1 "Helvetica Neue", Arial, sans-serif; fill:#111; text-anchor:middle; } .note { font: 400 12px/1.1 "Helvetica Neue", Arial, sans-serif; fill:#222; text-anchor:middle; font-style:italic; } .legend-text { font: 400 12px/1.1 "Helvetica Neue", Arial, sans-serif; fill:#111; text-anchor:start; } .marker-text { font: 600 12px/1.1 "Helvetica Neue", Arial, sans-serif; fill:#111; text-anchor:middle; } .bar { stroke:#000; stroke-width:1; rx:6; ry:6; } .axis { stroke:#bbb; stroke-width:1; } .continuation { stroke-width:4; stroke-linecap:round; stroke-dasharray:8,4; } </style> <!-- Title and subtitle --> <text class="title" x="600" y="36">TIMING ACTIVATION WINDOWS · 2025 – 2030</text> <text class="subtitle" x="600" y="58">Ranked by signal density and tradition convergence</text> <!-- Timeline baseline and year labels --> <g id="timeline"> <line class="axis" x1="120" y1="140" x2="1120" y2="140"/> <text class="year" x="120" y="160">2025</text> <text class="year" x="320" y="160">2026</text> <text class="year" x="520" y="160">2027</text> <text class="year" x="720" y="160">2028</text> <text class="year" x="920" y="160">2029</text> <text class="year" x="1120" y="160">2030</text> </g> <!-- Vertical markers --> <g id="markers" aria-hidden="false"> <!-- TODAY marker --> <line x1="300" y1="120" x2="300" y2="520" stroke="#8a6d1f" stroke-width="2" stroke-dasharray="6,4" /> <text class="marker-text" x="300" y="110" fill="#8a6d1f">▲ TODAY</text> <!-- LP Transition marker --> <line x1="500" y1="120" x2="500" y2="520" stroke="#8b1f2d" stroke-width="2" stroke-dasharray="6,4" /> <text class="marker-text" x="500" y="110" fill="#8b1f2d">LP Transition · Sep 2, 2026</text> </g> <!-- Activation bars --> <g id="activation-bars" aria-hidden="false"> <!-- Primary: Sep 2026 (x=500) to Sep 2028 (x=900) --> <g id="primary" aria-label="Primary activation window Sep 2026 to Sep 2028"> <rect class="bar" x="500" y="200" width="400" height="56" fill="#d9b26a" /> <text class="label" x="700" y="236">01 - PRIMARY · Sep 2026 – Sep 2028</text> </g> <!-- Secondary: Now (x=300) to Sep 2, 2026 (x=500) --> <g id="secondary" aria-label="Secondary activation window Now to Sep 2, 2026"> <rect class="bar" x="300" y="280" width="200" height="56" fill="#6f86b6" /> <text class="label" x="400" y="316">02 - SECONDARY · Now – Sep 2, 2026</text> </g> <!-- Tertiary: Apr 2030 (x=1040) to Dec 2032 (beyond chart) --> <g id="tertiary" aria-label="Tertiary activation window Apr 2030 to Dec 2032 (beyond chart)"> <!-- clipped portion visible on chart --> <rect class="bar" x="1040" y="360" width="80" height="56" fill="#8f6fbf" /> <text class="label" x="1080" y="396">03 - TERTIARY · Apr 2030 – Dec 2032</text> <!-- continuation indicator --> <line class="continuation" x1="1120" y1="388" x2="1160" y2="388" stroke="#8f6fbf"/> </g> </g> <!-- Left-side traditions list --> <g id="traditions" transform="translate(20,200)" aria-hidden="false"> <text class="legend-text" x="0" y="0">BaZi LP7</text> <text class="legend-text" x="0" y="24">Vedic</text> <text class="legend-text" x="0" y="48">Islamic</text> <text class="legend-text" x="0" y="72">Hellenistic</text> </g> <!-- Legend --> <g id="legend" transform="translate(120,540)" aria-hidden="false"> <rect x="0" y="-12" width="16" height="12" fill="#d9b26a" stroke="#000"/> <text class="legend-text" x="24" y="0">Primary</text> <rect x="140" y="-12" width="16" height="12" fill="#6f86b6" stroke="#000"/> <text class="legend-text" x="164" y="0">Secondary</text> <rect x="300" y="-12" width="16" height="12" fill="#8f6fbf" stroke="#000"/> <text class="legend-text" x="324" y="0">Tertiary</text> <line x1="460" y1="-6" x2="480" y2="-6" stroke="#8b1f2d" stroke-width="2" stroke-dasharray="6,4"/> <text class="legend-text" x="488" y="0">LP Transition</text> </g> <!-- Bottom note --> <text class="note" x="600" y="660">CCIAF is decision-support, not prediction. All dates are activation windows, not certainties.</text> </svg>
