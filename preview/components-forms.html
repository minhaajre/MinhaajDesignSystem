<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet"/>
<style>
  [data-theme="light"]{--bg:#F9F6F0;--surface:#fff;--border:#DDD8CE;--ink-1:#1A1510;--ink-2:#3D3830;--ink-3:#6B6358;--ink-4:#A09890;--gold:#8B6510;--gold-mid:#B8922A;--gold-light:#D4AE60;}
  [data-theme="dark"]{--bg:#131008;--surface:#1E1A10;--border:#2E2918;--ink-1:#F0EAD8;--ink-2:#C0B89E;--ink-3:#7A7260;--ink-4:#4A4438;--gold:#C8A03A;--gold-mid:#A07818;--gold-light:#E0BC70;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'EB Garamond',Georgia,serif;background:var(--bg);color:var(--ink-2);padding:40px 48px;transition:background .4s,color .4s}
  .label{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:var(--gold);margin:0 0 24px}
  .rule{height:1px;background:var(--border);margin:14px 0 28px}
  .ct-form{max-width:540px}
  .cf-field{margin-bottom:20px}
  .cf-field label{display:block;font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
  .cf-field input,.cf-field textarea{width:100%;border:1px solid var(--border);padding:12px 15px;font-family:'EB Garamond',Georgia,serif;font-size:16px;color:var(--ink-2);background:var(--surface);border-radius:0;outline:none;transition:border-color .2s,box-shadow .2s,background .4s,color .4s;-webkit-appearance:none;appearance:none}
  .cf-field input:focus,.cf-field textarea:focus{border-color:var(--gold-mid);box-shadow:0 0 0 3px rgba(139,101,16,.10)}
  [data-theme="dark"] .cf-field input:focus,[data-theme="dark"] .cf-field textarea:focus{box-shadow:0 0 0 3px rgba(200,160,58,.10)}
  .cf-field textarea{min-height:120px;resize:vertical}
  .cf-btn{display:inline-flex;align-items:center;font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--surface);background:var(--gold);border:1px solid var(--gold);padding:13px 32px;cursor:pointer;transition:background .25s,border-color .25s;-webkit-appearance:none;appearance:none}
  .cf-btn:hover{background:var(--gold-mid);border-color:var(--gold-mid)}
  [data-theme="dark"] .cf-btn{color:var(--bg)}
</style>
</head>
<body>
  <div class="label">CCIAF — Forms</div>
  <div class="rule"></div>
  <form class="ct-form" onsubmit="return false">
    <div class="cf-field">
      <label for="n">Name</label>
      <input id="n" type="text" placeholder="Your full name" />
    </div>
    <div class="cf-field">
      <label for="e">Email</label>
      <input id="e" type="email" placeholder="you@example.com" />
    </div>
    <div class="cf-field">
      <label for="m">Enquiry</label>
      <textarea id="m" placeholder="Describe the decision and its timing dimension…"></textarea>
    </div>
    <button class="cf-btn" type="submit">Send enquiry</button>
  </form>
</body>
</html>
