<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#F7F3EC;padding:24px 28px;display:flex;flex-direction:column;gap:14px}
  .label{font-family:'DM Sans',sans-serif;font-size:8px;letter-spacing:0.24em;text-transform:uppercase;color:#9A9383;margin-bottom:6px}
  .rule{height:1px;background:#D6CFC3}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
  .icon-cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border:1px solid #EDE8DE}
  .icon-cell svg{width:24px;height:24px;color:#8C7355}
  .icon-name{font-family:'DM Sans',sans-serif;font-size:7px;letter-spacing:0.1em;text-transform:uppercase;color:#9A9383;text-align:center}
  .on-dark{background:#14120F;padding:16px;margin-top:4px}
  .on-dark .icon-cell{border-color:rgba(255,255,255,0.08)}
  .on-dark .icon-cell svg{color:hsl(45,90%,60%)}
  .on-dark .icon-name{color:rgba(255,255,255,0.35)}
</style>
</head>
<body>
  <div class="label">IbnArbi — Custom Islamic Icon Set (1.5px stroke · 24×24)</div>
  <div class="grid">
    <div class="icon-cell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <div class="icon-name">Crescent</div>
    </div>
    <div class="icon-cell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 12.79A7 7 0 1 1 10.21 5 5.5 5.5 0 0 0 18 12.79z"/><path d="M19 4L19.5 5.5L21 6L19.5 6.5L19 8L18.5 6.5L17 6L18.5 5.5L19 4Z"/></svg>
      <div class="icon-name">Crescent Star</div>
    </div>
    <div class="icon-cell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L12 4"/><path d="M12 4C8 4 5 7 5 10V20H19V10C19 7 16 4 12 4Z"/><path d="M9 20V16C9 14.9 9.9 14 11 14H13C14.1 14 15 14.9 15 16V20"/><path d="M2 20V14L4 12"/><path d="M22 20V14L20 12"/></svg>

      <div class="icon-name">Kaaba</div>
    </div>
    <div class="icon-cell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M12 6L12 7.5"/><path d="M10.5 8.5C10.5 8.5 11 9 12 9C13 9 13.5 8.5 13.5 8.5"/><path d="M9 11H15"/><path d="M9 14H15"/></svg>

      <div class="icon-name">8pt Star</div>
    </div>
    <div class="icon-cell">

      <div class="icon-name">Fire</div>

    </div>
    <div class="icon-cell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22C16.42 22 20 18.42 20 14V10C20 5.58 16.42 2 12 2C7.58 2 4 5.58 4 10V14C4 18.42 7.58 22 12 22Z"/><path d="M4 14H20"/><path d="M8 18V22"/><path d="M16 18V22"/><path d="M12 14V10"/><path d="M9 10H15"/></svg>

    </div>
  </div>
  <div class="on-dark">
    <div class="label" style="color:rgba(255,255,255,0.35)">On dark (IbnArbi dark mode)</div>
    <div class="grid on-dark" style="background:transparent;padding:0">
      <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><div class="icon-name">Crescent</div></div>
      <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L13.5 8.5L20 7L15.5 12L20 17L13.5 15.5L12 22L10.5 15.5L4 17L8.5 12L4 7L10.5 8.5L12 2Z"/></svg><div class="icon-name">8pt Star</div></div>
      <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/><path d="M12 2V6"/><path d="M12 18V22"/><path d="M2 12H6"/><path d="M18 12H22"/></svg><div class="icon-name">Zodiac</div></div>
      <div class="icon-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C12 2 4 10 4 15C4 19.42 7.58 22 12 22C16.42 22 20 19.42 20 15C20 10 12 2 12 2Z"/></svg><div class="icon-name">Water</div></div>
    </div>
  </div>
</body>
</html>
