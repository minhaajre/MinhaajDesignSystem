<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#F7F3EC;padding:28px 36px;display:flex;flex-direction:column;gap:20px}
  .label{font-family:'DM Sans',sans-serif;font-size:8px;letter-spacing:0.24em;text-transform:uppercase;color:#9A9383;margin-bottom:6px}
  .rule{height:1px;background:#D6CFC3}
  .row{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}

  .logo-block{display:flex;flex-direction:column;gap:6px;align-items:center}
  .logo-bg-light{background:#FAFAF7;border:1px solid #D6CFC3;padding:20px 28px;display:flex;align-items:center;justify-content:center}
  .logo-bg-dark{background:#1E1C18;padding:20px 28px;display:flex;align-items:center;justify-content:center}
  .logo-caption{font-family:'DM Sans',sans-serif;font-size:7.5px;letter-spacing:0.18em;text-transform:uppercase;color:#9A9383;text-align:center}

  /* SVG nav logo mark */
  .logo-mark-svg{width:48px;height:48px}
  .logo-p{font-family:sans-serif;font-size:48px;font-weight:700;color:#3D3C38;line-height:1}
  .logo-dot{width:10px;height:10px;border-radius:50%;background:#3D3C38;display:inline-block;margin-left:2px;vertical-align:bottom;margin-bottom:4px}

  /* Wordmark */
  .wordmark{font-family:'DM Sans',sans-serif;font-size:1.4rem;font-weight:500;letter-spacing:0.36em;color:#1E1C18}
  .wordmark-light{color:#FAFAF7}
</style>
</head>
<body>
  <div class="label">Psyda Logo System</div>
  <div class="row">
    <div class="logo-block">
      <div class="logo-bg-light">
        <div style="display:flex;align-items:baseline">
          <div class="logo-p">P</div>
          <div class="logo-dot"></div>
        </div>
      </div>
      <div class="logo-caption">P. mark · light bg</div>
    </div>
    <div class="logo-block">
      <div class="logo-bg-dark">
        <div style="display:flex;align-items:baseline">
          <div class="logo-p" style="color:#FAFAF7">P</div>
          <div class="logo-dot" style="background:#FAFAF7"></div>
        </div>
      </div>
      <div class="logo-caption">P. mark · dark bg</div>
    </div>
    <div class="logo-block">
      <div class="logo-bg-light">
        <svg class="logo-mark-svg" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="15" stroke="#1E1C18" stroke-width="1"/><path d="M10 22 L10 10 L18 10 C21 10 22 12 22 14 C22 16 21 18 18 18 L13 18" stroke="#1E1C18" stroke-width="1.2" stroke-linecap="square"/></svg>
      </div>
      <div class="logo-caption">SVG nav mark</div>
    </div>
    <div class="logo-block">
      <div class="logo-bg-light">
        <div style="display:flex;align-items:center;gap:10px">
          <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="15" stroke="#1E1C18" stroke-width="1"/><path d="M10 22 L10 10 L18 10 C21 10 22 12 22 14 C22 16 21 18 18 18 L13 18" stroke="#1E1C18" stroke-width="1.2" stroke-linecap="square"/></svg>
          <div class="wordmark">PSYDA</div>
        </div>
      </div>
      <div class="logo-caption">Mark + wordmark · light</div>
    </div>
    <div class="logo-block">
      <div class="logo-bg-dark">
        <div style="display:flex;align-items:center;gap:10px">
          <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="15" stroke="#FAFAF7" stroke-width="1"/><path d="M10 22 L10 10 L18 10 C21 10 22 12 22 14 C22 16 21 18 18 18 L13 18" stroke="#FAFAF7" stroke-width="1.2" stroke-linecap="square"/></svg>
          <div class="wordmark wordmark-light">PSYDA</div>
        </div>
      </div>
      <div class="logo-caption">Mark + wordmark · dark</div>
    </div>
  </div>
  <div class="rule"></div>
  <div class="label">Color variations — on accent</div>
  <div class="row">
    <div class="logo-block">
      <div style="background:#8C7355;padding:20px 28px;display:flex;align-items:center;gap:10px">
        <svg width="24" height="24" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="15" stroke="#FAFAF7" stroke-width="1"/><path d="M10 22 L10 10 L18 10 C21 10 22 12 22 14 C22 16 21 18 18 18 L13 18" stroke="#FAFAF7" stroke-width="1.2" stroke-linecap="square"/></svg>
        <div class="wordmark wordmark-light" style="font-size:1rem">PSYDA</div>
      </div>
      <div class="logo-caption">On accent copper</div>
    </div>
  </div>
</body>
</html>
