<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet"/>
<style>
  [data-theme="light"]{--bg:#F9F6F0;--border:#DDD8CE;--ink-1:#1A1510;--ink-3:#6B6358;--gold:#8B6510;--nav-bg:rgba(249,246,240,.95);--tog-bg:#DDD8CE;--tog-knob:#8B6510;}
  [data-theme="dark"]{--bg:#131008;--border:#2E2918;--ink-1:#F0EAD8;--ink-3:#7A7260;--gold:#C8A03A;--nav-bg:rgba(19,16,8,.95);--tog-bg:#2E2918;--tog-knob:#C8A03A;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'EB Garamond',Georgia,serif;background:var(--bg);padding:40px 48px;transition:background .4s}
  .label{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:var(--gold);margin:0 0 24px}
  .rule{height:1px;background:var(--border);margin:14px 0 28px}

  /* Nav */
  header{background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:58px;padding:0 40px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative;margin-bottom:32px}
  .brand{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:300;letter-spacing:.20em;text-transform:uppercase;color:var(--ink-1)}
  .brand em{color:var(--gold);font-style:normal}
  .top-nav{display:flex;gap:28px;align-items:center}
  .top-nav a{font-size:15px;color:var(--ink-3);letter-spacing:.04em;text-decoration:none;transition:color .2s}
  .top-nav a:hover{color:var(--ink-1)}
  .hdr-right{display:flex;align-items:center;gap:14px}
  .hbg{display:none;background:none;border:1px solid var(--border);border-radius:5px;padding:6px 10px;cursor:pointer;font-family:'EB Garamond',serif;font-size:14px;color:var(--ink-3)}
  .tog{width:46px;height:26px;border-radius:13px;background:var(--tog-bg);border:1px solid var(--border);cursor:pointer;position:relative;-webkit-appearance:none;appearance:none}
  .tog::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--tog-knob);transition:transform .3s ease}
  [data-theme="dark"] .tog::after{transform:translateX(20px)}
  .cap{font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:24px 0 8px}
  @media(max-width:760px){.top-nav{display:none}.hbg{display:block}}
</style>
</head>
<body>
  <div class="label">CCIAF — Navigation</div>
  <div class="rule"></div>

  <header>
    <a class="brand" href="#"><em>CCIAF</em></a>
    <nav class="top-nav" aria-label="Primary navigation">
      <a href="#">The Problem</a>
      <a href="#">The Framework</a>
      <a href="#">Traditions</a>
      <a href="#">Engagement</a>
      <a href="#">About</a>
    </nav>
    <div class="hdr-right">
      <button class="hbg" aria-label="Open navigation menu">Menu</button>
      <button class="tog" role="switch" aria-checked="false" aria-label="Toggle dark mode"></button>
    </div>
  </header>

  <div class="cap">Fixed 58px · glassmorphism (blur 12px) · wordmark with gold em · centered links · theme toggle · hamburger ≤760px</div>
</body>
</html>
