<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#F7F3EC;padding:28px 36px;display:flex;flex-direction:column;gap:16px}
  .label{font-family:'DM Sans',sans-serif;font-size:8px;letter-spacing:0.24em;text-transform:uppercase;color:#9A9383;margin-bottom:6px}
  .rule{height:1px;background:#D6CFC3}

  /* Psyda nav */
  .psyda-nav{
    display:flex;align-items:center;justify-content:space-between;
    height:56px;padding:0 32px;
    background:rgba(247,243,236,0.78);backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(30,28,24,0.08);
  }
  .nav-logo{display:flex;align-items:center;gap:10px;color:#1E1C18}
  .nav-logo-mark{width:24px;height:24px}
  .nav-logo-text{font-family:'DM Sans',sans-serif;font-size:0.82rem;font-weight:500;letter-spacing:0.28em;color:#1E1C18}
  .nav-links{display:flex;gap:28px;align-items:center}
  .nav-link{
    font-family:'DM Sans',sans-serif;font-size:0.68rem;font-weight:400;
    letter-spacing:0.22em;text-transform:uppercase;color:#6B6457;
    padding:4px 0;position:relative;cursor:pointer;transition:color 0.3s;
  }
  .nav-link::after{
    content:'';position:absolute;left:0;right:100%;bottom:0;height:1px;
    background:#1E1C18;transition:right 0.5s cubic-bezier(0.22,1,0.36,1);
  }
  .nav-link:hover{color:#1E1C18}
  .nav-link:hover::after{right:0}
  .nav-link.active{color:#1E1C18}
  .nav-link.active::after{right:0;background:#8C7355}

  /* Side rail */
  .side-rail{display:flex;flex-direction:column;gap:16px;align-items:flex-end}
  .sr-item{display:flex;align-items:center;gap:8px;font-family:'DM Sans',sans-serif;font-size:0.58rem;letter-spacing:0.25em;text-transform:uppercase;color:#9A9383;cursor:pointer}
  .sr-dot{width:6px;height:6px;border-radius:50%;border:1px solid #8C7355;background:transparent;flex-shrink:0}
  .sr-item.active{color:#1E1C18}
  .sr-item.active .sr-dot{background:#8C7355}

  /* Progress bar */
  .progress-bar{height:3px;background:#8C7355;box-shadow:0 0 8px rgba(140,115,85,0.25);width:60%}

  /* Mobile drawer */
  .mobile-drawer{background:#F7F3EC;padding:32px 24px;display:flex;flex-direction:column;gap:20px;border-top:1px solid rgba(30,28,24,0.08)}
  .drawer-link{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:300;color:#1E1C18}
</style>
</head>
<body>
  <div class="label">Fixed Navigation — Psyda (frosted glass on scroll)</div>
  <div class="progress-bar"></div>
  <div class="psyda-nav">
    <div class="nav-logo">
      <svg class="nav-logo-mark" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="15" stroke="#1E1C18" stroke-width="1"/><path d="M10 22 L10 10 L18 10 C21 10 22 12 22 14 C22 16 21 18 18 18 L13 18" stroke="#1E1C18" stroke-width="1.2" stroke-linecap="square"/></svg>
      <span class="nav-logo-text">PSYDA</span>
    </div>
    <div class="nav-links">
      <div class="nav-link active">Home</div>
      <div class="nav-link">Analytics</div>
      <div class="nav-link">Research</div>
      <div class="nav-link">Media</div>
      <div class="nav-link">Contact</div>
    </div>
  </div>
  <div class="rule"></div>
  <div class="label" style="margin-top:4px">Side Rail — Section Progress (desktop only)</div>
  <div class="side-rail">
    <div class="sr-item active"><span>Home</span><div class="sr-dot"></div></div>
    <div class="sr-item"><span>Analytics</span><div class="sr-dot"></div></div>
    <div class="sr-item"><span>Research</span><div class="sr-dot"></div></div>
    <div class="sr-item"><span>Media</span><div class="sr-dot"></div></div>
    <div class="sr-item"><span>Contact</span><div class="sr-dot"></div></div>
  </div>
  <div class="rule"></div>
  <div class="label">Mobile Drawer — Cormorant Garamond nav links</div>
  <div class="mobile-drawer">
    <div class="drawer-link">Home</div>
    <div class="drawer-link">Analytics</div>
    <div class="drawer-link">Research</div>
  </div>
</body>
</html>
