<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet"/>
<style>
  [data-theme="light"]{--bg:#F9F6F0;--surface:#fff;--bg-alt:#F2EDE3;--border:#DDD8CE;--ink-1:#1A1510;--ink-2:#3D3830;--ink-3:#6B6358;--ink-4:#A09890;--gold:#8B6510;--gold-light:#D4AE60;--shadow:0 1px 3px rgba(26,21,16,.08),0 4px 16px rgba(26,21,16,.05);--shadow-strong:0 24px 70px rgba(26,21,16,.16);}
  [data-theme="dark"]{--bg:#131008;--surface:#1E1A10;--bg-alt:#1B170D;--border:#2E2918;--ink-1:#F0EAD8;--ink-2:#C0B89E;--ink-3:#7A7260;--ink-4:#4A4438;--gold:#C8A03A;--gold-light:#E0BC70;--shadow:0 1px 3px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.2);--shadow-strong:0 24px 70px rgba(0,0,0,.35);}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'EB Garamond',Georgia,serif;background:var(--bg);color:var(--ink-2);padding:40px 48px;line-height:1.7;transition:background .4s,color .4s}
  .label{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:var(--gold);margin:0 0 24px}
  .rule{height:1px;background:var(--border);margin:14px 0 28px}
  .grid{display:flex;gap:28px;flex-wrap:wrap}
  .cell{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
  .demo{width:160px;height:110px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;color:var(--ink-3);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .cap{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4)}
  .val{font-size:12px;color:var(--ink-2)}
</style>
</head>
<body>
  <div class="label">CCIAF — Radii &amp; Shadows</div>
  <div class="rule"></div>

  <div class="label" style="margin-bottom:10px">Radii (near-zero by design)</div>
  <div class="grid">
    <div class="cell"><div class="demo" style="border-radius:2px">--radius-sm · 2px</div><div class="cap">surface cards</div></div>
    <div class="cell"><div class="demo" style="border-radius:4px">--radius-md · 4px</div><div class="cap">tooltip labels</div></div>
    <div class="cell"><div class="demo" style="border-radius:999px">--radius-full · 999px</div><div class="cap">pills, buttons</div></div>
    <div class="cell"><div class="demo" style="border-radius:13px;width:80px">--radius-pill</div><div class="cap">theme toggle</div></div>
  </div>

  <div class="label" style="margin:40px 0 10px">Shadows (dual-layer, subtle)</div>
  <div class="grid">
    <div class="cell"><div class="demo" style="box-shadow:var(--shadow)">--shadow</div><div class="val">0 1px 3px / 0 4px 16px</div></div>
    <div class="cell"><div class="demo" style="box-shadow:var(--shadow-strong)">--shadow-strong</div><div class="val">0 24px 70px</div></div>
    <div class="cell"><div class="demo" style="box-shadow:0 0 0 3px rgba(139,101,16,.10)">focus ring</div><div class="val">gold, 3px spread</div></div>
  </div>
</body>
</html>
