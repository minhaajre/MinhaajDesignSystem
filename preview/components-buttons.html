<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#F7F3EC;padding:28px 36px;display:flex;flex-direction:column;gap:16px}
  .label{font-family:'DM Sans',sans-serif;font-size:8px;letter-spacing:0.24em;text-transform:uppercase;color:#9A9383;margin-bottom:6px}
  .rule{height:1px;background:#D6CFC3;margin:8px 0}
  .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

  /* Psyda button */
  .btn-psyda{
    display:inline-flex;align-items:center;gap:0.9rem;
    padding:1rem 1.8rem;
    font-family:'DM Sans',sans-serif;font-size:0.68rem;font-weight:400;
    letter-spacing:0.22em;text-transform:uppercase;
    color:#1E1C18;border:1px solid #1E1C18;background:transparent;cursor:pointer;
    position:relative;overflow:hidden;transition:color 0.4s cubic-bezier(0.22,1,0.36,1);
  }
  .btn-psyda::before{
    content:'';position:absolute;inset:0;background:#1E1C18;
    transform:translateY(101%);transition:transform 0.45s cubic-bezier(0.22,1,0.36,1);z-index:-1;
  }
  .btn-psyda:hover{color:#FAFAF7}
  .btn-psyda:hover::before{transform:translateY(0)}
  .btn-psyda svg{width:22px;height:10px;transition:transform 0.4s cubic-bezier(0.22,1,0.36,1)}
  .btn-psyda:hover svg{transform:translateX(4px)}

  /* Accent button */
  .btn-accent{
    display:inline-flex;align-items:center;gap:0.9rem;
    padding:1rem 1.8rem;
    font-family:'DM Sans',sans-serif;font-size:0.68rem;font-weight:400;
    letter-spacing:0.22em;text-transform:uppercase;
    color:#8C7355;border:1px solid #8C7355;background:transparent;cursor:pointer;
    position:relative;overflow:hidden;transition:color 0.4s cubic-bezier(0.22,1,0.36,1);
  }
  .btn-accent::before{
    content:'';position:absolute;inset:0;background:#8C7355;
    transform:translateY(101%);transition:transform 0.45s cubic-bezier(0.22,1,0.36,1);z-index:-1;
  }
  .btn-accent:hover{color:#FAFAF7}
  .btn-accent:hover::before{transform:translateY(0)}

  /* IbnArbi button (shadcn style) */
  .btn-ib-primary{
    display:inline-flex;align-items:center;gap:0.5rem;
    padding:0.5rem 1.2rem;border-radius:0.5rem;
    font-family:'DM Sans',sans-serif;font-size:0.875rem;font-weight:500;
    background:hsl(35,85%,35%);color:#fff;border:none;cursor:pointer;
    transition:background 0.25s;
  }
  .btn-ib-primary:hover{background:hsl(35,85%,28%)}

  .btn-ib-ghost{
    display:inline-flex;align-items:center;gap:0.5rem;
    padding:0.5rem 1.2rem;border-radius:0.5rem;
    font-family:'DM Sans',sans-serif;font-size:0.875rem;font-weight:400;
    background:transparent;color:hsl(35,85%,35%);border:none;cursor:pointer;
    transition:background 0.2s;
  }
  .btn-ib-ghost:hover{background:hsl(35,85%,35%,0.08)}

  .btn-ib-outline{
    display:inline-flex;align-items:center;gap:0.5rem;
    padding:0.5rem 1.2rem;border-radius:0.5rem;
    font-family:'DM Sans',sans-serif;font-size:0.875rem;font-weight:400;
    background:transparent;color:hsl(240,25%,12%);border:1px solid hsl(40,20%,80%);cursor:pointer;
    transition:background 0.2s;
  }
  .btn-ib-outline:hover{background:hsl(40,20%,92%)}

  .on-dark{background:#14120F;padding:20px 24px;display:flex;gap:16px;align-items:center}
  .btn-dark{
    display:inline-flex;align-items:center;gap:0.9rem;
    padding:0.9rem 1.6rem;
    font-family:'DM Sans',sans-serif;font-size:0.68rem;font-weight:400;
    letter-spacing:0.22em;text-transform:uppercase;
    color:#FAFAF7;border:1px solid rgba(250,250,247,0.4);background:transparent;cursor:pointer;
  }
</style>
</head>
<body>
  <div class="label">Psyda / Minhaaj.com — Fill-sweep buttons</div>
  <div class="row">
    <button class="btn-psyda">Our LinkedIn <svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1"><path d="M0 6 H22 M16 1 L22 6 L16 11"/></svg></button>
    <button class="btn-accent">Explore research <svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1"><path d="M0 6 H22 M16 1 L22 6 L16 11"/></svg></button>
  </div>
  <div class="on-dark">
    <div class="btn-dark">Book session →</div>
    <div class="btn-dark" style="border-color:#8C7355;color:#B89A78">Learn more →</div>
  </div>
  <div class="rule"></div>
  <div class="label">IbnArbi — shadcn/ui rounded buttons</div>
  <div class="row">
    <button class="btn-ib-primary">Primary</button>
    <button class="btn-ib-outline">Outline</button>
    <button class="btn-ib-ghost">Ghost</button>
  </div>
  <div class="row" style="margin-top:4px">
    <button class="btn-ib-primary" style="border-radius:9999px;background:hsl(45,90%,60%);color:hsl(240,30%,4%)">Dark mode pill</button>
    <button class="btn-ib-ghost" style="background:hsl(260,50%,30%,0.2);color:hsl(260,50%,70%)">Accent ghost</button>
  </div>
</body>
</html>
