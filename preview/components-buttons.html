<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet"/>
<style>
  [data-theme="light"]{--bg:#F9F6F0;--surface:#fff;--border:#DDD8CE;--ink-1:#1A1510;--ink-2:#3D3830;--ink-3:#6B6358;--ink-4:#A09890;--gold:#8B6510;--gold-mid:#B8922A;--gold-light:#D4AE60;}
  [data-theme="dark"]{--bg:#131008;--surface:#1E1A10;--border:#2E2918;--ink-1:#F0EAD8;--ink-2:#C0B89E;--ink-3:#7A7260;--ink-4:#4A4438;--gold:#C8A03A;--gold-mid:#A07818;--gold-light:#E0BC70;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'EB Garamond',Georgia,serif;background:var(--bg);color:var(--ink-2);padding:40px 48px;transition:background .4s,color .4s}
  .label{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:var(--gold);margin:0 0 24px}
  .rule{height:1px;background:var(--border);margin:14px 0 28px}
  .row{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
  .cap{width:100%;font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4);margin-bottom:4px}
  .btn-outline,.btn-solid{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 26px;border:1px solid var(--gold-light);border-radius:999px;font-family:'Cormorant Garamond',serif;font-size:.78rem;letter-spacing:.14em;line-height:1.2;text-transform:uppercase;text-align:center;cursor:pointer;transition:color .2s,background .2s,border-color .2s,transform .2s}
  .btn-outline{background:transparent;color:var(--gold)}
  .btn-outline:hover{background:var(--ink-1);color:var(--bg);border-color:var(--ink-1);transform:translateY(-1px)}
  .btn-solid{background:var(--ink-1);color:var(--bg);border-color:var(--ink-1)}
  .btn-solid:hover{background:var(--gold);border-color:var(--gold);transform:translateY(-1px)}
  .cf-btn{display:inline-flex;align-items:center;font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--surface);background:var(--gold);border:1px solid var(--gold);padding:13px 32px;cursor:pointer;transition:background .25s,border-color .25s}
  .cf-btn:hover{background:var(--gold-mid);border-color:var(--gold-mid)}
  [data-theme="dark"] .cf-btn{color:var(--bg)}
</style>
</head>
<body>
  <div class="label">CCIAF — Buttons (pill only)</div>
  <div class="rule"></div>

  <div class="cap">Outline · default / hover</div>
  <div class="row">
    <button class="btn-outline">Explore research →</button>
    <button class="btn-outline" onmouseover="" onmouseout="">Read more →</button>
  </div>

  <div class="cap">Solid · default / hover</div>
  <div class="row">
    <button class="btn-solid">Our LinkedIn →</button>
    <button class="btn-solid">← Back</button>
  </div>

  <div class="cap">Contact form submit (.cf-btn)</div>
  <div class="row">
    <button class="cf-btn">Send enquiry</button>
  </div>

  <div class="cap" style="margin-top:8px">All variants: border-radius 999px · Cormorant Garamond · 0.14em uppercase · 0.2s transitions · translateY(-1px) on hover</div>
</body>
</html>
