name: Design Quality Gate

on:
  pull_request:
    paths:
      - "src/**"
      - "app/**"
      - "pages/**"
      - "components/**"
      - "**.html"
      - "**.css"
      - "**.jsx"
      - "**.tsx"
      - "**.vue"
      - "**.svelte"

jobs:
  anti-slop-check:
    name: impeccable detect (anti-slop gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"   # impeccable detect requires Node >=22

      - name: Run impeccable detect
        id: detect
        run: |
          npx impeccable detect src/ --json > detect-report.json 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE
        continue-on-error: true

      - name: Upload detect report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impeccable-detect-report
          path: detect-report.json

      - name: Post PR comment on failure
        if: steps.detect.outputs.exit_code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '(report unavailable)';
            try {
              report = fs.readFileSync('detect-report.json', 'utf8');
              const parsed = JSON.parse(report);
              report = JSON.stringify(parsed, null, 2).slice(0, 3000);
            } catch (e) {}

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ Design Quality Gate Failed\n\n` +
                    `\`npx impeccable detect\` found AI-slop anti-patterns in this PR.\n\n` +
                    `Fix all flagged issues before merging. Run locally:\n\n` +
                    `\`\`\`bash\nnpx impeccable detect src/\n\`\`\`\n\n` +
                    `<details><summary>Detect report</summary>\n\n` +
                    `\`\`\`json\n${report}\n\`\`\`\n</details>`
            });

      - name: Fail if anti-patterns detected
        if: steps.detect.outputs.exit_code == '2'
        run: |
          echo "::error::impeccable detect found AI-slop anti-patterns. Exit code 2."
          echo "Run 'npx impeccable detect src/' locally to see details."
          exit 2

      - name: Success
        if: steps.detect.outputs.exit_code == '0'
        run: echo "✓ Design quality gate passed — 0 anti-patterns detected."
